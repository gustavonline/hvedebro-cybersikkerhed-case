<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Bus factor illustration - høj personafhængighed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#ecf2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#c7d6ef" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <text x="70" y="74" font-family="Inter, Segoe UI, Arial" font-size="38" font-weight="800" fill="#1b3c91">Bus factor: kritisk personafhængighed i driften</text>
  <text x="70" y="112" font-family="Inter, Segoe UI, Arial" font-size="24" fill="#4d648c">Hvis én nøgleperson er væk, kan centrale processer stoppe</text>

  <g filter="url(#shadow)">
    <rect x="70" y="150" width="470" height="470" rx="22" fill="#ffffff" stroke="#d4deef"/>
    <text x="100" y="195" font-family="Inter, Segoe UI, Arial" font-size="29" font-weight="700" fill="#1f4fd7">Nøgleperson kender alene:</text>

    <g font-family="Inter, Segoe UI, Arial" font-size="24" fill="#4f6387">
      <text x="105" y="248">• OT-fjernadgang / admin-login</text>
      <text x="105" y="288">• Backup-gendannelse i praksis</text>
      <text x="105" y="328">• Kritiske leverandørkontakter</text>
      <text x="105" y="368">• Lokal økonomisoftware og nøglefiler</text>
      <text x="105" y="408">• Uformelle workarounds i produktionen</text>
    </g>

    <g transform="translate(295 480)">
      <circle cx="0" cy="0" r="42" fill="#5e7393"/>
      <rect x="-45" y="45" width="90" height="82" rx="24" fill="#5e7393"/>
      <circle cx="14" cy="-8" r="7" fill="#ffffff"/>
      <rect x="-22" y="68" width="44" height="32" rx="8" fill="#ffffff" opacity="0.9"/>
      <text x="0" y="89" text-anchor="middle" font-family="Inter, Segoe UI" font-size="15" font-weight="700" fill="#1f4fd7">KEY</text>
    </g>

    <rect x="88" y="560" width="436" height="44" rx="10" fill="#fff3f3" stroke="#f0c4c4"/>
    <text x="104" y="590" font-family="Inter, Segoe UI, Arial" font-size="22" fill="#9b2b2b">Resultat: høj bus factor-risiko (single point of failure)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="610" y="150" width="520" height="470" rx="22" fill="#ffffff" stroke="#d4deef"/>

    <g transform="translate(650 214)">
      <rect x="0" y="100" width="265" height="108" rx="14" fill="#e7efff" stroke="#c5d7ff"/>
      <rect x="18" y="120" width="36" height="24" rx="5" fill="#1f4fd7"/>
      <rect x="65" y="120" width="36" height="24" rx="5" fill="#1f4fd7"/>
      <rect x="112" y="120" width="36" height="24" rx="5" fill="#1f4fd7"/>
      <circle cx="60" cy="216" r="22" fill="#2e4773"/>
      <circle cx="208" cy="216" r="22" fill="#2e4773"/>
      <rect x="0" y="144" width="265" height="30" fill="#cfe0ff"/>
      <text x="132" y="164" text-anchor="middle" font-family="Inter, Segoe UI" font-size="19" font-weight="700" fill="#1f4fd7">BUS</text>

      <line x1="280" y1="154" x2="430" y2="154" stroke="#d34949" stroke-width="6" stroke-dasharray="11 9"/>
      <polygon points="430,154 405,140 405,168" fill="#d34949"/>

      <rect x="450" y="118" width="220" height="74" rx="12" fill="#fff4f4" stroke="#efc8c8"/>
      <text x="560" y="146" text-anchor="middle" font-family="Inter, Segoe UI" font-size="22" font-weight="700" fill="#b42318">Konsekvens</text>
      <text x="560" y="172" text-anchor="middle" font-family="Inter, Segoe UI" font-size="18" fill="#8f2f2f">Driftsstop / forsinkelser</text>

      <rect x="0" y="244" width="670" height="64" rx="12" fill="#f8fbff" stroke="#d5e0f3"/>
      <text x="16" y="282" font-family="Inter, Segoe UI" font-size="23" fill="#4f6488">Uden dokumenterede processer bliver viden fanget hos få personer</text>
    </g>
  </g>
</svg>
